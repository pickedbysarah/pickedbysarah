<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picked by Sarah | Things Worth Sharing</title>
  <meta name="description" content="Picked by Sarah is a curated collection of thoughtful finds for garden, beauty, pets, hobbies, personal growth and wellness.">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    :root {
      --forest: #1f4937;
      --deep-forest: #17392c;
      --forest-light: #426b56;
      --sage: #dce7d9;
      --sage-dark: #9fb8a4;
      --sage-soft: #edf2e8;
      --cream: #f6f0e4;
      --cream-light: #fffdf7;
      --terracotta: #c76543;
      --terracotta-dark: #ad5235;
      --robin: #9cced0;
      --text: #26362d;
      --muted: #657269;
      --shadow: 0 15px 40px rgba(31, 73, 55, 0.10);
    }

    body {
      margin: 0;
      font-family: 'DM Sans', Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(156, 206, 208, 0.12), transparent 28%),
        radial-gradient(circle at 85% 45%, rgba(159, 184, 164, 0.18), transparent 30%),
        linear-gradient(180deg, #f8f4e9 0%, #eef3e8 45%, #f5efe2 100%);
      line-height: 1.6;
    }

    a { color: inherit; }

    /* NAV */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 13px 6%;
      background: rgba(250, 247, 238, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(31, 73, 55, 0.08);
    }

    .brand {
      text-decoration: none;
      color: var(--forest);
      flex: 0 0 auto;
    }

    .brand-name {
      font-family: 'Caveat', cursive;
      font-size: 36px;
      font-weight: 700;
      line-height: .9;
    }

    .brand-tagline {
      display: block;
      margin-top: 5px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 18px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      transition: .2s ease;
    }

    .nav-links a:hover { color: var(--terracotta); }

    .nav-favorite {
      background: var(--terracotta);
      color: white !important;
      padding: 10px 17px;
      border-radius: 40px;
    }


    .favorite-strip p { margin: 0; color: #dce8df; font-size: 13px; }

    .favorite-strip > span {
      white-space: nowrap;
      color: #f5d3c4;
      font-weight: 700;
    }

    .mushroom-divider {
      margin-top: 33px;
      text-align: center;
      font-size: 21px;
      opacity: .8;
    }

    main {
      max-width: 1180px;
      margin: auto;
      padding: 10px 22px 80px;
    }

    .intro {
      text-align: center;
      max-width: 720px;
      margin: 20px auto 80px;
    } 
    
    /* HERO */
    .sarah-hero {
      max-width: 1380px;
      min-height: 600px;
      margin: 28px auto 65px;
      padding: 50px;
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      align-items: center;
      gap: 40px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 15%, rgba(199, 101, 67, 0.12), transparent 30%),
        linear-gradient(135deg, #f8f1e4, #e8eee2);
      border: 1px solid rgba(31, 73, 55, 0.12);
      border-radius: 38px;
      box-shadow: 0 22px 60px rgba(31, 73, 55, 0.13);
    }

    .sarah-hero::before {
      content: "🍄";
      position: absolute;
      left: 22px;
      bottom: 18px;
      font-size: 46px;
      transform: rotate(-8deg);
    }

    .sarah-hero::after {
      content: "🌿";
      position: absolute;
      right: 24px;
      top: 20px;
      font-size: 42px;
      transform: rotate(12deg);
    }

    .hero-text-card {
      position: relative;
      z-index: 2;
      padding: 50px 44px;
      background: rgba(255, 253, 247, 0.94);
      border: 1px solid rgba(31, 73, 55, .1);
      border-radius: 30px 12px 30px 12px;
      box-shadow: 0 15px 40px rgba(31, 73, 55, .09);
    }

    .hero-kicker {
      margin: 0 0 15px;
      color: var(--terracotta);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .hero-text-card h1 {
      margin: 0 0 24px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(55px, 6vw, 82px);
      line-height: .92;
      color: var(--forest);
    }

    .hero-text-card h1 span {
      display: block;
      margin-left: 55px;
      font-family: 'Caveat', cursive;
      font-size: 1.18em;
      font-weight: 600;
      color: var(--terracotta);
    }

    .hero-copy {
      max-width: 460px;
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero-main-button,
    .hero-second-button {
      display: inline-block;
      padding: 14px 23px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .hero-main-button {
      background: var(--terracotta);
      color: white;
      box-shadow: 0 8px 20px rgba(173, 82, 53, .2);
    }

    .hero-second-button {
      color: var(--forest);
      border: 1px solid rgba(31, 73, 55, .35);
    }

    .hero-main-button:hover,
    .hero-second-button:hover { transform: translateY(-2px); }

    .hero-note-new {
      margin: 30px 0 0;
      font-family: 'Caveat', cursive;
      font-size: 28px;
      color: var(--forest-light);
      transform: rotate(-2deg);
    }

    .mia-side {
      position: relative;
      padding: 25px;
      text-align: center;
    }

    .mia-hero-image {
      display: block;
      width: 100%;
      max-width: 680px;
      margin: auto;
      border-radius: 28px;
      box-shadow: 0 25px 55px rgba(23, 57, 44, .23);
    }

    .mia-label {
      position: absolute;
      z-index: 3;
      top: 3px;
      left: 5px;
      padding: 10px 17px;
      background: rgba(246, 240, 228, .96);
      border-radius: 15px;
      box-shadow: 0 5px 18px rgba(31, 73, 55, .12);
      font-family: 'Caveat', cursive;
      font-size: 30px;
      color: var(--forest);
      transform: rotate(-3deg);
    }

    .mia-label small {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      color: var(--muted);
    }

    /* EXPLORE */
    .cozy-explore {
      max-width: 1250px;
      margin: 0 auto 80px;
      padding: 55px 35px;
      position: relative;
      background: linear-gradient(145deg, rgba(255, 253, 247, .96), rgba(237, 242, 232, .93));
      border: 1px solid rgba(31, 73, 55, .10);
      border-radius: 34px;
      box-shadow: 0 18px 45px rgba(31, 73, 55, .08);
    }

    .explore-heading {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 35px;
      margin-bottom: 38px;
    }

    .explore-small {
      color: var(--terracotta);
      text-transform: uppercase;
      letter-spacing: 2.5px;
      font-size: 10px;
      font-weight: 700;
    }

    .explore-heading h2 {
      margin: 5px 0 10px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(38px, 5vw, 57px);
      line-height: 1.05;
      color: var(--forest);
    }

    .explore-heading h2 span {
      font-family: 'Caveat', cursive;
      color: var(--terracotta);
    }

    .explore-heading p {
      max-width: 620px;
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
    }

    .explore-note {
      max-width: 220px;
      padding: 18px 22px;
      background: #f4e7d5;
      border-radius: 8px 22px 8px 22px;
      font-family: 'Caveat', cursive;
      font-size: 23px;
      line-height: 1.15;
      color: var(--forest);
      transform: rotate(2deg);
      box-shadow: 0 8px 20px rgba(31, 73, 55, .08);
    }

    .cozy-category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .cozy-category {
      min-height: 250px;
      padding: 30px 28px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      border: 1px solid rgba(31, 73, 55, .10);
      border-radius: 10px 28px 10px 28px;
      box-shadow: 0 12px 30px rgba(31, 73, 55, .08);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .cozy-category:hover {
      transform: translateY(-5px) rotate(-.5deg);
      box-shadow: 0 18px 38px rgba(31, 73, 55, .13);
    }

    .cozy-category::after {
      content: "❧";
      position: absolute;
      right: 18px;
      bottom: 10px;
      font-size: 42px;
      color: rgba(31, 73, 55, .10);
    }

    .cozy-icon { font-size: 34px; margin-bottom: 10px; }

    .cozy-category h3 {
      margin: 0 0 10px;
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--forest);
    }

    .cozy-category p {
      flex: 1;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .cozy-category span {
      color: var(--terracotta);
      font-size: 13px;
      font-weight: 700;
    }

    .garden-card { background: #edf2e8; }
    .beauty-card { background: #f8eee6; }
    .pet-card { background: #e8f0ed; }
    .hobby-card { background: #f5ead7; }
    .growth-card { background: #efece2; }
    .wellness-card { background: #f4eee0; }

    .favorite-strip {
      margin-top: 27px;
      padding: 27px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      text-decoration: none;
      background: var(--forest);
      color: white;
      border-radius: 24px 8px 24px 8px;
      box-shadow: 0 15px 32px rgba(23, 57, 44, .18);
    }

    .favorite-strip small {
      color: var(--robin);
      letter-spacing: 2px;
      font-size: 9px;
    }

    .favorite-strip strong {
      display: block;
      margin: 4px 0;
      font-family: 'Playfair Display', serif;
      font-size: 23px;
    }


    .intro-label {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--forest-light);
    }

    .intro h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(38px, 5vw, 58px);
      margin: 5px 0 13px;
      color: var(--deep-forest);
    }

    .intro p { color: var(--muted); font-size: 17px; }

    .little-leaf {
      font-family: 'Caveat', cursive;
      color: var(--forest-light);
      font-size: 28px;
      margin-top: 15px;
    }

    /* SECTIONS */
    .category,
    .favorites {
      max-width: 1180px;
      margin: 75px auto;
      padding: 48px 38px;
      position: relative;
      background: rgba(255, 253, 247, .72);
      border: 1px solid rgba(31, 73, 55, .08);
      border-radius: 34px 12px 34px 12px;
      box-shadow: 0 15px 45px rgba(31, 73, 55, .06);
      scroll-margin-top: 100px;
    }

    .category::before {
      content: "🍄  ❧  🌿";
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      white-space: nowrap;
      opacity: .75;
    }

    .category-heading,
    .favorites-title {
      max-width: 680px;
      margin: 0 auto 38px;
      text-align: center;
    }

    .category-heading .small,
    .favorites-title span {
      display: inline-block;
      margin-bottom: 7px;
      color: var(--terracotta);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2.3px;
    }

    .category-heading h2,
    .favorites-title h2 {
      margin: 0 0 12px;
      font-family: 'Playfair Display', serif;
      color: var(--forest);
      font-size: clamp(34px, 4vw, 48px);
    }

    .category-heading p,
    .favorites-title p {
      margin: auto;
      color: var(--muted);
      line-height: 1.75;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .product {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 30px;
      background: #fffaf1;
      border: 1px solid rgba(31, 73, 55, .09);
      border-radius: 12px 28px 12px 28px;
      box-shadow: 0 12px 28px rgba(31, 73, 55, .08);
      transition: transform .2s ease, box-shadow .2s ease;
      overflow: hidden;
    }

    .product:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 38px rgba(31, 73, 55, .12);
    }

    .product::after {
      content: "❧";
      position: absolute;
      right: 18px;
      bottom: 8px;
      font-size: 30px;
      color: rgba(31, 73, 55, .08);
    }

    .product h3 {
      margin: 7px 0 12px;
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      line-height: 1.25;
      color: var(--forest);
    }

    .product p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
      flex-grow: 1;
    }

    .product-note {
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--sage-soft);
      font-size: 12px !important;
    }

    .product img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      margin-bottom: 20px;
      border-radius: 10px 22px 10px 22px;
    }

    .button {
      display: inline-block;
      align-self: flex-start;
      margin-top: 8px;
      padding: 11px 18px;
      background: var(--terracotta);
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      border-radius: 9px;
      transition: transform .2s ease, background .2s ease;
    }

    .button:hover {
      background: var(--terracotta-dark);
      transform: translateY(-2px);
    }

    .favorite-card {
      background: linear-gradient(145deg, #f7eee0, #edf2e8);
      border: 1px solid rgba(199, 101, 67, .20);
    }

    .tried-badge {
      display: inline-block;
      width: fit-content;
      margin-bottom: 9px;
      padding: 6px 11px;
      background: var(--forest);
      color: #fffaf1;
      border-radius: 20px;
      font-family: 'Caveat', cursive;
      font-size: 18px;
      line-height: 1;
    }

    /* NOTE */
    .sarah-note {
      max-width: 1100px;
      margin: 90px auto;
      padding: 35px;
      display: grid;
      grid-template-columns: 1.4fr .6fr;
      gap: 28px;
      align-items: stretch;
    }

    .sarah-note-paper {
      padding: 50px 48px;
      position: relative;
      background: #fffaf0;
      border: 1px solid rgba(31, 73, 55, .10);
      border-radius: 8px 32px 8px 32px;
      box-shadow: 0 18px 42px rgba(31, 73, 55, .09);
    }

    .sarah-note-paper::before {
      content: "❧";
      position: absolute;
      right: 25px;
      top: 18px;
      font-size: 38px;
      color: rgba(31, 73, 55, .13);
    }

    .sarah-note-small {
      display: inline-block;
      margin-bottom: 8px;
      color: var(--terracotta);
      font-family: 'Caveat', cursive;
      font-size: 25px;
    }

    .sarah-note h2 {
      max-width: 650px;
      margin: 0 0 22px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 5vw, 52px);
      line-height: 1.08;
      color: var(--forest);
    }

    .sarah-note-paper p {
      max-width: 650px;
      color: var(--muted);
      line-height: 1.85;
      font-size: 15px;
    }

    .sarah-signature {
      margin-top: 27px;
      font-family: 'Caveat', cursive;
      font-size: 25px;
      color: var(--forest-light);
    }

    .sarah-signature strong {
      display: block;
      margin-left: 25px;
      color: var(--terracotta);
      font-size: 34px;
    }

    .sarah-note-side {
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      background: #e4ecdf;
      border-radius: 30px 8px 30px 8px;
      transform: rotate(1.5deg);
      box-shadow: 0 13px 30px rgba(31, 73, 55, .09);
    }

    .note-mushrooms { margin-bottom: 13px; font-size: 27px; }

    .sarah-note-side p {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      line-height: 1.55;
      color: var(--forest);
    }

    .sarah-note-side span {
      margin-top: 20px;
      font-family: 'Caveat', cursive;
      font-size: 23px;
      color: var(--terracotta);
    }

    /* VALUES + DISCLOSURE */
    .values {
      margin-top: 70px;
      padding: 60px 7%;
      color: white;
      background: linear-gradient(135deg, var(--deep-forest), #2f654c);
    }

    .values-inner {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 35px;
      text-align: center;
    }

    .value-icon { font-size: 31px; }

    .value h3 {
      margin: 8px 0 6px;
      font-family: 'Playfair Display', serif;
      font-size: 21px;
    }

    .value p { margin: 0; color: #dce8df; font-size: 14px; }

    .disclosure {
      max-width: 850px;
      margin: 70px auto 30px;
      padding: 28px 35px;
      background: rgba(255, 253, 247, .85);
      border: 1px solid rgba(31, 73, 55, .13);
      border-radius: 22px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .disclosure strong {
      display: block;
      margin-bottom: 7px;
      color: var(--forest);
      font-size: 15px;
    }

    /* FOOTER */
    .sarah-footer {
      margin-top: 80px;
      padding: 55px 7% 28px;
      overflow: hidden;
      background: linear-gradient(145deg, #17392c, #244d3b);
      color: #f6f0e4;
    }

    .footer-mushrooms {
      margin-bottom: 35px;
      text-align: center;
      font-size: 21px;
      opacity: .9;
    }

    .footer-content {
      max-width: 1180px;
      margin: auto;
      display: grid;
      grid-template-columns: 1.4fr .8fr .8fr;
      gap: 55px;
    }

    .footer-brand-new {
      font-family: 'Playfair Display', serif;
      font-size: 37px;
      color: #fffaf1;
    }

    .footer-brand-new span {
      font-family: 'Caveat', cursive;
      font-size: 1.25em;
      color: #e49a78;
    }

    .footer-about > p {
      max-width: 390px;
      color: #dce8df;
      font-size: 14px;
      line-height: 1.8;
    }

    .footer-note {
      margin-top: 20px;
      font-family: 'Caveat', cursive;
      font-size: 23px;
      color: var(--robin);
    }

    .footer-nav-group h3 {
      margin: 8px 0 17px;
      font-family: 'Playfair Display', serif;
      color: #f6f0e4;
      font-size: 18px;
    }

    .footer-nav-group a {
      display: block;
      margin: 9px 0;
      color: #dce8df;
      text-decoration: none;
      font-size: 13px;
    }

    .footer-nav-group a:hover { color: #e8a183; }

    .mia-footer {
      margin-top: 22px;
      font-family: 'Caveat', cursive;
      font-size: 21px;
      color: #f1c9b5;
    }

    .footer-divider {
      max-width: 1180px;
      height: 1px;
      margin: 42px auto 28px;
      background: rgba(255,255,255,.15);
    }

    .footer-disclosure {
      max-width: 760px;
      margin: auto;
      text-align: center;
      color: #bfcdc4;
      font-size: 11px;
    }

    .footer-disclosure strong { color: #e8eee2; font-size: 12px; }
    .footer-disclosure p { margin: 6px 0; }

    .footer-bottom {
      max-width: 1180px;
      margin: 28px auto 0;
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #9fb8a4;
      font-size: 11px;
    }

    @media (max-width: 1000px) {
      .nav-links { display: none; }
      .top-nav { justify-content: center; }
      .sarah-hero { grid-template-columns: 1fr; margin: 20px 15px 50px; padding: 25px; gap: 20px; }
      .hero-text-card { padding: 38px 27px; text-align: center; }
      .hero-text-card h1 { font-size: 56px; }
      .hero-text-card h1 span { margin-left: 0; }
      .hero-copy { margin-left: auto; margin-right: auto; }
      .hero-actions { justify-content: center; }
      .mia-side { padding: 15px 0 0; }
      .mia-label { left: 12px; }

   /* =========================================
   COZY COTTAGE HERO
========================================= */

.cottage-hero {
  max-width: 1400px;
  min-height: 620px;
  margin: 28px auto 70px;

  display: grid;
  grid-template-columns: .9fr 1.1fr;

  position: relative;
  overflow: hidden;

  background: #f8f1e5;

  border: 1px solid rgba(31, 73, 55, .12);
  border-radius: 36px 14px 36px 14px;

  box-shadow: 0 25px 65px rgba(31, 73, 55, .14);
}


/* LEFT SIDE */

.cottage-copy {
  position: relative;
  z-index: 10;

  padding: 65px 55px;

  display: flex;
  flex-direction: column;
  justify-content: center;

  background:
    linear-gradient(
      145deg,
      rgba(255, 251, 241, .98),
      rgba(247, 238, 222, .96)
    );
}

.cottage-copy::before {
  content: "🌿";

  position: absolute;
  left: 22px;
  top: 20px;

  font-size: 28px;
  opacity: .65;

  transform: rotate(-15deg);
}

.cottage-copy::after {
  content: "🍄";

  position: absolute;
  right: 25px;
  bottom: 25px;

  font-size: 36px;
}

.cottage-kicker {
  width: fit-content;

  margin-bottom: 18px;
  padding: 8px 16px;

  background: #f4ded2;

  border-radius: 30px;

  color: var(--terracotta);

  font-size: 10px;
  font-weight: 700;

  letter-spacing: 2.4px;
  text-transform: uppercase;
}

.cottage-copy h1 {
  margin: 0 0 28px;

  font-family: 'Playfair Display', serif;

  font-size: clamp(58px, 6vw, 88px);
  line-height: .88;

  color: var(--forest);
}

.cottage-copy h1 span {
  display: block;

  margin-left: 65px;

  font-family: 'Caveat', cursive;

  font-size: 1.15em;
  font-weight: 600;

  color: var(--terracotta);
}

.cottage-intro {
  max-width: 470px;

  margin: 0 0 14px;

  color: #53675c;

  font-family: 'Playfair Display', serif;

  font-size: 18px;
  line-height: 1.7;
}

.cottage-whisper {
  max-width: 460px;

  margin: 0 0 28px;

  color: #758178;

  font-size: 13px;
  font-style: italic;

  line-height: 1.6;
}

.cottage-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.cottage-main-button,
.cottage-soft-button {
  display: inline-block;

  padding: 14px 23px;

  border-radius: 30px;

  text-decoration: none;

  font-size: 13px;
  font-weight: 700;
}

.cottage-main-button {
  background: var(--terracotta);
  color: white;

  box-shadow: 0 10px 23px rgba(173, 82, 53, .20);
}

.cottage-soft-button {
  background: rgba(255,255,255,.5);

  color: var(--forest);

  border: 1px solid rgba(31, 73, 55, .25);
}

.cottage-signoff {
  margin-top: 34px;

  font-family: 'Caveat', cursive;

  font-size: 24px;

  color: var(--forest-light);
}


/* RIGHT COTTAGE SCENE */

.cottage-scene {
  min-height: 620px;

  position: relative;
  overflow: hidden;

  background:
    linear-gradient(
      180deg,
      #ead6c5 0%,
      #d8dfcc 35%,
      #789381 67%,
      #405f50 100%
    );
}


/* SUN */

.sun-glow {
  width: 310px;
  height: 310px;

  position: absolute;
  left: 7%;
  top: 35px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255, 225, 169, .95),
      rgba(247, 185, 131, .40) 35%,
      transparent 72%
    );
}


/* MOUNTAINS */

.mountain {
  position: absolute;

  left: -10%;

  width: 120%;

  clip-path:
    polygon(
      0 100%,
      0 65%,
      12% 42%,
      21% 58%,
      34% 29%,
      48% 59%,
      61% 38%,
      74% 60%,
      88% 35%,
      100% 58%,
      100% 100%
    );
}

.mountain-one {
  height: 260px;
  top: 170px;

  background: #708575;

  opacity: .65;
}

.mountain-two {
  height: 225px;
  top: 225px;

  background: #496b58;

  opacity: .85;
}


/* TREES */

.tree-line {
  position: absolute;

  left: 0;
  right: 0;

  top: 300px;

  height: 150px;

  background-color: #274d3b;

  clip-path:
    polygon(
      0 100%,
      0 70%,
      5% 35%,
      10% 70%,
      15% 25%,
      20% 72%,
      27% 30%,
      34% 70%,
      42% 20%,
      50% 72%,
      58% 28%,
      66% 70%,
      74% 20%,
      82% 70%,
      90% 28%,
      100% 65%,
      100% 100%
    );
}


/* WATER */

.lake {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 245px;

  overflow: hidden;

  background:
    linear-gradient(
      180deg,
      #78988a,
      #527969 45%,
      #315848
    );
}

.lake::before {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  top: 35px;

  height: 100px;

  opacity: .30;

  background:
    repeating-linear-gradient(
      180deg,
      rgba(255,255,255,.38) 0 2px,
      transparent 2px 13px
    );
}

.water-shine {
  width: 170px;
  height: 210px;

  position: absolute;

  left: 11%;
  top: -20px;

  opacity: .6;

  background:
    linear-gradient(
      180deg,
      rgba(255, 220, 168, .55),
      transparent
    );

  clip-path:
    polygon(
      40% 0,
      60% 0,
      95% 100%,
      5% 100%
    );
}


/* COTTAGE */

.little-cottage {
  width: 255px;
  height: 230px;

  position: absolute;

  right: 9%;
  bottom: 175px;

  z-index: 8;
}

.house {
  width: 220px;
  height: 145px;

  position: absolute;

  left: 17px;
  bottom: 0;

  background:
    linear-gradient(
      90deg,
      #9a684a,
      #bb8160
    );

  border: 4px solid #5b493b;

  box-shadow: 0 15px 30px rgba(20,40,30,.28);
}

.roof {
  width: 260px;
  height: 120px;

  position: absolute;

  left: -3px;
  top: 2px;

  z-index: 4;

  background: #344b3e;

  clip-path:
    polygon(
      50% 0,
      100% 100%,
      0 100%
    );
}

.chimney {
  width: 27px;
  height: 68px;

  position: absolute;

  right: 38px;
  top: 17px;

  z-index: 3;

  background: #725347;

  border: 3px solid #493a33;
}


/* WINDOWS */

.window {
  width: 46px;
  height: 49px;

  position: absolute;

  top: 35px;

  z-index: 3;

  border: 5px solid #5b493b;

  background: #ffd68f;

  box-shadow:
    0 0 23px rgba(255, 200, 100, .75);
}

.window-one {
  left: 25px;
}

.window-two {
  right: 25px;
}


/* DOOR */

.door {
  width: 50px;
  height: 78px;

  position: absolute;

  left: 83px;
  bottom: 0;

  z-index: 3;

  background: #4a5c48;

  border: 4px solid #55463b;

  border-radius: 12px 12px 0 0;
}

.door span {
  width: 7px;
  height: 7px;

  position: absolute;

  right: 7px;
  top: 37px;

  border-radius: 50%;

  background: #d7ad65;
}


/* DOCK */

.dock {
  width: 290px;
  height: 28px;

  position: absolute;

  right: 7%;
  bottom: 135px;

  z-index: 9;

  background:
    repeating-linear-gradient(
      90deg,
      #6f503c 0 32px,
      #4d3b31 32px 35px
    );
}

.dock-light {
  width: 12px;
  height: 35px;

  position: absolute;

  left: 55px;
  top: -37px;

  background: #263c31;
}

.dock-light::after {
  content: "";

  width: 18px;
  height: 23px;

  position: absolute;

  left: -3px;
  top: -16px;

  border-radius: 5px;

  background: #ffd38d;

  box-shadow: 0 0 22px #ffc46f;
}


/* MUSHROOMS */

.mushroom {
  width: 38px;
  height: 52px;

  position: absolute;

  z-index: 12;
}

.mushroom span {
  width: 11px;
  height: 33px;

  position: absolute;

  left: 14px;
  bottom: 0;

  border-radius: 7px;

  background: #ead7ba;
}

.mushroom::before {
  content: "";

  width: 38px;
  height: 24px;

  position: absolute;

  border-radius: 38px 38px 10px 10px;

  background: #c76543;
}

.mushroom-one {
  left: 5%;
  bottom: 45px;
}

.mushroom-two {
  left: 11%;
  bottom: 25px;

  transform: scale(.72);
}

.mushroom-three {
  right: 4%;
  bottom: 35px;

  transform: scale(.85);
}


/* GREENERY */

.cozy-grass {
  position: absolute;

  z-index: 11;

  font-size: 55px;
}

.grass-left {
  left: 0;
  bottom: 0;
}

.grass-right {
  right: 0;
  bottom: 0;
}


/* LITTLE NOTE */

.cottage-note {
  position: absolute;

  right: 25px;
  top: 25px;

  z-index: 13;

  padding: 14px 18px;

  background:
    rgba(255, 248, 232, .90);

  border-radius:
    7px 17px 7px 17px;

  box-shadow:
    0 8px 20px rgba(31,73,55,.13);

  color:
    var(--forest);

  font-family:
    'Caveat',
    cursive;

  font-size: 23px;
  line-height: 1.05;

  text-align: center;

  transform: rotate(2deg);
}


/* PHONE */

@media (max-width: 900px) {

  .cottage-hero {
    grid-template-columns: 1fr;

    margin:
      20px 14px 60px;
  }

  .cottage-copy {
    padding:
      48px 30px;

    text-align: center;
  }

  .cottage-copy h1 {
    font-size: 62px;
  }

  .cottage-copy h1 span {
    margin-left: 0;
  }

  .cottage-intro,
  .cottage-whisper {
    margin-left: auto;
    margin-right: auto;
  }

  .cottage-buttons {
    justify-content: center;
  }

  .cottage-kicker {
    margin-left: auto;
    margin-right: auto;
  }

  .cottage-scene {
    min-height: 500px;
  }

  .little-cottage {
    right: 8%;

    transform: scale(.82);

    transform-origin:
      bottom right;
  }

}
